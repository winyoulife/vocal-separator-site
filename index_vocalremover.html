<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> AI 音樂工具箱</title>
    <style>
        body { font-family: sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { text-align: center; color: white; margin-bottom: 30px; }
        h1 { font-size: 2.5em; }
        .tools-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .tool-section { background: white; border-radius: 15px; padding: 20px; }
        iframe { width: 100%; height: 600px; border: none; border-radius: 10px; }
        @media (max-width: 768px) { .tools-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1> AI 音樂工具箱</h1>
            <p>人聲分離 + 進階後製 = 專業音樂製作</p>
        </header>
        <div class="tools-container">
            <div class="tool-section">
                <h3> 步驟 1：人聲分離</h3>
                <iframe src="https://vocalremover.org/"></iframe>
            </div>
            <div class="tool-section">
                <h3> 步驟 2：進階後製</h3>
                <iframe src="https://winyoulife-vocal-separator.hf.space"></iframe>
            </div>
        </div>
    </div>
</body>
</html>
